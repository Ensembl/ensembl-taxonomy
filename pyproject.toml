[build-system]
requires = [
    "setuptools",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "ensembl-taxonomy"
description = "An NCBI Taxonomy package"
version = "2.0.0"
requires-python = ">= 3.10"
dependencies = [
    "duckdb>=1.1.3",
    "pandas>=2.2.3",
    "pyarrow>=19.0.0",
    "requests>= 2.22.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true

[tool.pylint.main]
max-line-length = 110
disable = [
    "invalid-name",
    "similarities",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-statements",
    "unspecified-encoding",
]
